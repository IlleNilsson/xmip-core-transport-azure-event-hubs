# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-azure-event-hubs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure-event-hubs"
description = "Azure Event Hubs transport: a Shared Access Signature over the REST API — send a Stream as one event to a hub or one of its partitions; reading is AMQP, and this transport says so — a hub is a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The endpoint parser, the request and its answer, percent-encoding, and TLS
# behind the `tls` feature — one TLS stack in the estate, the http
# technology's (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# The Shared Access Signature every servicebus.windows.net namespace takes,
# and the judgement of its answers, come from the azure-service-bus
# technology, the carrier of that signature in the estate (ADR-0044).
transport_azure_service_bus = { package = "xmip-core-transport-azure-service-bus", git = "https://github.com/IlleNilsson/xmip-core-transport-azure-service-bus", branch = "main" }
# BrokerProperties travels as a JSON header, and serde writes it.
serde_json = "1"

[features]
default = []
# HTTPS endpoints. Off by default, as it is in the http technology.
tls = ["http/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
