[package]
name = "xmip-core-transport-azure-event-hubs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure-event-hubs"
description = "Azure Event Hubs transport: a Shared Access Signature over the REST API — send a Stream as one event to a hub or one of its partitions; reading is AMQP, and this transport says so — a hub is a Location. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The endpoint parser, the request and its answer, and
# TLS behind the `tls` feature — one TLS stack in the estate, the http
# technology's (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main", optional = true }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# The Shared Access Signature every servicebus.windows.net namespace takes,
# and the judgement of its answers. They came from the azure-service-bus
# technology until 2026-09-14; a technology never imports a sibling for
# them, and what Azure speaks is the Azure crate's (ADR-0044, the owner's
# ruling of 2026-09-22). Its declaration alone where this crate is
# (`key_name::key_name`).
azure = { package = "xmip-core-transport-azure", git = "https://github.com/IlleNilsson/xmip-core-transport-azure", branch = "main", default-features = false }
# BrokerProperties travels as a JSON header, and serde writes it.
serde_json = { version = "1", optional = true }

[dev-dependencies]
# A Location's secret held in memory (`transport::secured::Kept`), from the
# capability's test support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "azure/default", "dep:http", "dep:net", "dep:serde_json"]
# The declaration alone, the Azure crate's `key_name` among its settings.
declaration = ["azure/declaration"]
# HTTPS endpoints: the http technology's `tls`, off by default as there.
tls = ["default", "http/tls"]

[lints]
workspace = true
